<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budget Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="header">
        <div class="header-left">
            <h1>Budget Tracker v01</h1>
        </div>
    
        <div class="header-center">
            <a class="navBtn" href="index.html">Home</a>
            <a class="navBtn" href="transactions.html">Transactions</a>
        </div>

        <div class="header-right">
            <span class="themeBtn" id="theme-btn">🌙 Dark Mode</span>
        </div>
    </header>

    <main class="layout" id="layout">

    <!-- Summary Board -->
    <div class="board summary">
        <div class="summary-top">
            <h2>Month Overview</h2>
        </div>
        
        <div class="summary-mid">
            <span class="summary-box">Balance</br></br>
                <span class="summary-number" id="balance-total"> $10,000 </span>
            </span>
            <span class="summary-box">Income</br></br>
                <span class="summary-number" id="income-total"> $10,000 </span>
            </span>
            <span class="summary-box">Currency</br>
                <span id="currency-conversion"> (1 USD to KRW) </span>
                <span class="summary-number" id="currency-result"> ₩1,400 </span>
                <button id="currency-reverse">⇆</button>
            </span>
        </div>

        <div class="summary-low">
            <span class="summary-box">Expenses: $8,000 (Budget: $9,000) </span>
        </div>
    </div>

    <!-- Category Board -->

    <div class="board category">
        <h2>Spending By Category</h2>
        <span>Housing: $2,000</span>
    </div>

    <!-- Recent Transactions -->

    <div class="board transactions">
        <h2>Recent Transactions</h2>
        <span>Rent: $2,000 </span>
    </div>
    </main>

    <!-- Popup Contact Form -->
    <div class="overlay" id="overlay">
        <div class="popup" id="popup">
            <div class="popup-top">
                <h2>Contact Us</h2>
                <button class="closeBtn" id="closeBtn">x</button>
            </div>
            <form id="contactForm">
                <label for="name">Name</label>
                <input id="name" type="text" required>
                <label for="email">Email</label>
                <input id="email" type="email" required>
                <label for="message">Message</label>
                <textarea id="message" rows="7" required placeholder="Enter your message here."></textarea>
                <div class="submit-button">
                    <button type="submit">Submit</button>
                </div>
            </form>

        </div>
    </div>

    <footer>
        <p>&copy; 2026 Jae</p>
        <span id="contactBtn" class="contactBtn">Contact form</span>
    </footer>

    <script src="app.js"></script>
  </body>
