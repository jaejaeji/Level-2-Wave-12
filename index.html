<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budget Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="header">
        <div class="header-left">
            <h1>Budget Tracker v01</h1>
        </div>
    
        <div class="header-center">
            <span class="navBtn">Home</span>
            <span class="navBtn">Transactions</span>
        </div>

        <div class="header-right">
            <span class="darkmodeBtn">🌙 Dark Mode</span>
        </div>
    </header>

    <main class="layout">

    <!-- Summary Board -->
    <div class="board summary">
        <div class="overview-top">
            <h2>Month Overview</h2>
        </div>
        
        <div class="overview-mid">
            <span>Balance: $10,000 </span>
            <span>Income: $10,000 </span>
            <span>Currency(1 USD to KRW): ₩1,400</span>
        </div>

        <div class="overview-low">
            <span>Expenses: $8,000 (Budget: $9,000) </span>
        </div>
    </div>

    <!-- Category Board -->

    <div class="board category">
        <h2>Spending By Category</h2>
        <span>Housing: $2,000</span>
    </div>

    <!-- Recent Transactions -->

    <div class="board transactions">
        <h2>Recent Transactions</h2>
        <span>Rent: $2,000 </span>
    </div>
</main>


    <footer>
        <p>&copy; 2026 Jae</p>
        <span id="contact" class="contact-form"><a>Contact form</a></span>
    </footer>

  </body>
